<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- Subtle border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" fill="none" stroke="#e03535" stroke-width="1" opacity="0.6"/>

  <!-- R letter: stem -->
  <rect x="5.5" y="8" width="2.8" height="16" rx="1.2" fill="white"/>
  <!-- R top bar -->
  <rect x="5.5" y="8" width="8.5" height="2.8" rx="1.2" fill="white"/>
  <!-- R mid bar -->
  <rect x="5.5" y="14.2" width="7.5" height="2.6" rx="1.2" fill="white"/>
  <!-- R bump right side -->
  <rect x="11.2" y="8" width="2.8" height="8.8" rx="1.4" fill="white"/>
  <!-- R leg diagonal -->
  <path d="M12.5 17 L16.5 24" stroke="white" stroke-width="2.6" stroke-linecap="round"/>

  <!-- N letter: left stem -->
  <rect x="17.5" y="8" width="2.7" height="16" rx="1.2" fill="#e03535"/>
  <!-- N right stem -->
  <rect x="25.8" y="8" width="2.7" height="16" rx="1.2" fill="#e03535"/>
  <!-- N diagonal -->
  <path d="M17.5 8.5 L28.5 23.5" stroke="#e03535" stroke-width="2.7" stroke-linecap="round"/>

</svg>
