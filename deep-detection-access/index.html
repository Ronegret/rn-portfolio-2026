<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>Acceso privado | Taller Deep Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="module" src="/src/deepDetectionAccess.js"></script>
</head>
<body>
  <main class="access-shell">
    <section class="access-card">
      <img src="/assets/deep-detection/deep-detection-logo.svg" alt="Deep Detection" />
      <p class="access-kicker">Taller privado de discovery</p>
      <h1>Acceso privado</h1>
      <p>Esta página contiene un taller de discovery preparado específicamente para Deep Detection.</p>
      <form id="accessForm">
        <label for="password">Contraseña de acceso</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Entrar al discovery</button>
        <p id="accessMessage" role="status" aria-live="polite"></p>
      </form>
      <span class="access-signature">Rodrigo Negrete · Product Designer UX/UI · IA aplicada</span>
    </section>
  </main>
</body>
</html>
